<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAOU PhD Scholar & Alumni Progress Portal — Prof. (Dr.) Ami Upadhyay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        baou: {
                            navy: '#0F2544',
                            dark: '#09172B',
                            blue: '#1E40AF',
                            gold: '#C59B27',
                            goldLight: '#F3E5AB',
                            cream: '#F8FAFC',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col selection:bg-amber-200 selection:text-baou-navy">

    <!-- Toast / Notification Banner Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-md w-full pointer-events-none px-4 sm:px-0"></div>

    <!-- Institutional Top Header -->
    <header class="bg-baou-navy text-white shadow-lg border-b-4 border-baou-gold sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3.5 cursor-pointer" onclick="navigateHome()">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-400 to-baou-gold p-0.5 shadow-md flex-shrink-0">
                    <div class="w-full h-full bg-baou-dark rounded-[10px] flex items-center justify-center text-baou-gold">
                        <i class="fa-solid fa-graduation-cap text-xl"></i>
                    </div>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold uppercase tracking-widest text-amber-300">Dr. Babasaheb Ambedkar Open University</span>
                    </div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight text-white leading-tight">
                        PhD & Research Scholars Weekly Supervision Portal
                    </h1>
                    <p class="text-xs text-slate-300 hidden sm:block">
                        Under the Guidance of <span class="text-amber-300 font-semibold">Prof. (Dr.) Ami Upadhyay</span>, Hon'ble Vice-Chancellor
                    </p>
                </div>
            </div>

            <!-- Dynamic Header Actions -->
            <div id="header-actions" class="flex items-center gap-2 sm:gap-3"></div>
        </div>
    </header>

    <!-- Main Application Root -->
    <main id="app-root" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8"></main>

    <!-- Scholar Detailed Inspection Modal (For VC Review) -->
    <div id="scholar-modal" class="fixed inset-0 z-50 hidden bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
        <div id="scholar-modal-content" class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-200 fade-in"></div>
    </div>

    <!-- Institutional Footer -->
    <footer class="bg-baou-dark text-slate-400 border-t border-slate-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
            <div class="flex items-center gap-2 text-center sm:text-left">
                <i class="fa-solid fa-university text-baou-gold"></i>
                <span>Dr. Babasaheb Ambedkar Open University (BAOU), Jyotirmay Parisar, Ahmedabad — Research & Doctoral Cell</span>
            </div>
            <div class="flex items-center gap-4">
                <span>Sunday Review Cycle Active</span>
            </div>
        </div>
    </footer>

    <script>
        // =========================================================================
        // 1. SUPABASE CLOUD CONNECTION (PRESERVED LIVE CREDENTIALS)
        // =========================================================================
        const SUPABASE_URL = 'https://yotdcypdydktevtacxsm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0m9fFl0Z2tAcze6fopxEvA_I2q2JcKd';
        const SESSION_KEY = 'baou_phd_session_v1';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Application State
        let state = {
            scholars: [],
            currentUser: null, // { role: 'vc' } OR { role: 'scholar', id: '...' }
            activeLandingTab: 'login', // 'login' | 'register'
            vcActiveTab: 'all', // 'pending' | 'all' | 'active' | 'alumni' | 'issues'
            vcSearchQuery: '',
            selectedModalScholarId: null,
            isSubmitting: false
        };

        // Normalize Supabase row into the exact UI shape used by the original portal
        function mapRowToScholar(row) {
            return {
                id: String(row.id),
                fullName: row.name || '',
                email: (row.email || '').toLowerCase(),
                phone: row.phone || '',
                enrollmentNo: row.enrollment_no || 'BAOU/PHD/PENDING',
                scholarType: row.category === 'passed' ? 'Passed / Alumni Scholar' : 'Active PhD Scholar',
                passingYear: row.passing_year || '',
                department: row.department || 'School of Humanities & Social Sciences',
                thesisTitle: row.topic || '',
                scopusStatus: row.scopus_status || 'Not Started',
                scopusPaperTitle: row.scopus_title || 'Not yet specified',
                scopusJournal: row.scopus_journal || 'Not yet specified',
                scopusDoi: row.scopus_doi || 'Pending update',
                initialProgress: row.progress_till_date || '',
                approvalStatus: toTitleCaseStatus(row.approval_status),
                registeredAt: row.created_at ? String(row.created_at).split('T')[0] : new Date().toISOString().split('T')[0],
                weeklyLogs: Array.isArray(row.logs) ? row.logs : []
            };
        }

        function toTitleCaseStatus(status) {
            if (!status) return 'Pending';
            const lower = String(status).toLowerCase();
            if (lower === 'approved') return 'Approved';
            if (lower === 'rejected') return 'Rejected';
            return 'Pending';
        }

        function saveSession() {
            try {
                if (state.currentUser) {
                    sessionStorage.setItem(SESSION_KEY, JSON.stringify(state.currentUser));
                } else {
                    sessionStorage.removeItem(SESSION_KEY);
                }
            } catch (e) {
                console.error('Session save error:', e);
            }
        }

        function loadSession() {
            try {
                const raw = sessionStorage.getItem(SESSION_KEY);
                state.currentUser = raw ? JSON.parse(raw) : null;
            } catch (e) {
                state.currentUser = null;
            }
        }

        async function fetchAllScholarsFromCloud() {
            try {
                const { data, error } = await supabaseClient
                    .from('phd_scholars')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                state.scholars = (data || []).map(mapRowToScholar);
            } catch (e) {
                console.error('Error loading scholars from Supabase:', e);
                showToast('Could not sync records from Supabase: ' + (e.message || 'Check table & policies.'), 'error');
            }
        }

        async function fetchScholarByEmail(email) {
            const { data, error } = await supabaseClient
                .from('phd_scholars')
                .select('*')
                .eq('email', email.toLowerCase())
                .maybeSingle();

            if (error) throw error;
            return data ? mapRowToScholar(data) : null;
        }

        async function fetchScholarById(id) {
            const { data, error } = await supabaseClient
                .from('phd_scholars')
                .select('*')
                .eq('id', id)
                .maybeSingle();

            if (error) throw error;
            return data ? mapRowToScholar(data) : null;
        }

        // =========================================================================
        // 2. TOAST NOTIFICATION HELPER
        // =========================================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const styles = {
                success: 'bg-emerald-900 text-white border-emerald-500',
                error: 'bg-rose-900 text-white border-rose-500',
                warning: 'bg-amber-900 text-white border-amber-400',
                info: 'bg-baou-navy text-white border-baou-gold'
            };

            const icons = {
                success: 'fa-circle-check text-emerald-400',
                error: 'fa-circle-exclamation text-rose-400',
                warning: 'fa-triangle-exclamation text-amber-300',
                info: 'fa-circle-info text-amber-300'
            };

            toast.className = `pointer-events-auto flex items-start gap-3 p-4 rounded-xl shadow-2xl border-l-4 ${styles[type] || styles.info} fade-in`;
            toast.innerHTML = `
                <i class="fa-solid ${icons[type] || icons.info} mt-0.5 text-lg"></i>
                <div class="text-sm font-medium leading-snug flex-1">${message}</div>
                <button onclick="this.parentElement.remove()" class="text-white/70 hover:text-white text-xs ml-2 cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-6px)';
                    toast.style.transition = 'all 0.25s ease';
                    setTimeout(() => toast.remove(), 250);
                }
            }, 4500);
        }

        // =========================================================================
        // 3. NAVIGATION & AUTHENTICATION HANDLERS
        // =========================================================================
        function navigateHome() {
            if (state.currentUser) {
                renderApp();
            } else {
                state.activeLandingTab = 'login';
                renderApp();
            }
        }

        function switchLandingTab(tab) {
            state.activeLandingTab = tab;
            renderApp();
        }

        async function handleLogin(event) {
            event.preventDefault();
            if (state.isSubmitting) return;

            const emailInput = document.getElementById('login-email').value.trim().toLowerCase();
            const passwordInput = document.getElementById('login-password').value.trim();

            if (!emailInput || !passwordInput) {
                showToast('Please enter both Email ID and Password.', 'error');
                return;
            }

            // 1. Check Vice-Chancellor Credentials
            if (emailInput === 'vc@baou.edu.in') {
                if (passwordInput === 'vc@123') {
                    state.isSubmitting = true;
                    renderApp();
                    await fetchAllScholarsFromCloud();
                    state.currentUser = { role: 'vc' };
                    saveSession();
                    state.isSubmitting = false;
                    renderApp();
                    showToast('Welcome, Hon’ble Vice-Chancellor Prof. (Dr.) Ami Upadhyay.', 'success');
                } else {
                    showToast('Invalid Vice-Chancellor password. Please verify your credentials.', 'error');
                }
                return;
            }

            // 2. Check Registered Scholars in Supabase (Email = User ID, Mobile Number = Password)
            state.isSubmitting = true;
            renderApp();

            try {
                const scholar = await fetchScholarByEmail(emailInput);
                state.isSubmitting = false;

                if (!scholar) {
                    renderApp();
                    showToast('No scholar record found with this Email ID. Please submit a Registration Request first.', 'error');
                    return;
                }

                if (scholar.phone !== passwordInput) {
                    renderApp();
                    showToast('Incorrect Password. Remember: Your registered Mobile Number is your password.', 'error');
                    return;
                }

                if (scholar.approvalStatus === 'Pending') {
                    renderApp();
                    showToast('Your registration request is currently PENDING APPROVAL from Prof. (Dr.) Ami Upadhyay. Access will activate once approved.', 'warning');
                    return;
                }

                if (scholar.approvalStatus === 'Rejected') {
                    renderApp();
                    showToast('Your registration request was not approved. Please contact the BAOU Research Cell.', 'error');
                    return;
                }

                const idx = state.scholars.findIndex(s => s.id === scholar.id);
                if (idx >= 0) state.scholars[idx] = scholar;
                else state.scholars.unshift(scholar);

                state.currentUser = { role: 'scholar', id: scholar.id };
                saveSession();
                renderApp();
                showToast(`Welcome back, ${scholar.fullName}!`, 'success');
            } catch (err) {
                state.isSubmitting = false;
                renderApp();
                showToast('Login error: ' + (err.message || 'Unable to verify credentials.'), 'error');
            }
        }

        function handleLogout() {
            state.currentUser = null;
            state.selectedModalScholarId = null;
            saveSession();
            closeScholarModal();
            renderApp();
            showToast('You have been logged out securely.', 'info');
        }

        // =========================================================================
        // 4. NEW SCHOLAR / ALUMNI REGISTRATION SUBMISSION (SAVES TO SUPABASE)
        // =========================================================================
        function togglePassingYearField() {
            const typeVal = document.getElementById('reg-scholar-type').value;
            const passingGroup = document.getElementById('passing-year-group');
            const progressLabel = document.getElementById('reg-progress-label');
            if (typeVal === 'Passed / Alumni Scholar') {
                passingGroup.classList.remove('hidden');
                progressLabel.textContent = 'PhD Completion Details, Viva Date & Post-PhD Summary *';
            } else {
                passingGroup.classList.add('hidden');
                progressLabel.textContent = 'PhD Progress Summary Till Date (Coursework, RDC, Chapters, Fieldwork) *';
            }
        }

        async function handleRegistration(event) {
            event.preventDefault();
            if (state.isSubmitting) return;

            const fullName = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const phone = document.getElementById('reg-phone').value.trim();
            const enrollmentNo = document.getElementById('reg-enrollment').value.trim();
            const scholarType = document.getElementById('reg-scholar-type').value;
            const passingYear = document.getElementById('reg-passing-year').value.trim();
            const department = document.getElementById('reg-department').value.trim();
            const thesisTitle = document.getElementById('reg-thesis').value.trim();
            const scopusStatus = document.getElementById('reg-scopus-status').value;
            const scopusPaperTitle = document.getElementById('reg-scopus-title').value.trim();
            const scopusJournal = document.getElementById('reg-scopus-journal').value.trim();
            const initialProgress = document.getElementById('reg-progress').value.trim();

            if (!fullName || !email || !phone || !thesisTitle || !initialProgress) {
                showToast('Please fill all mandatory fields marked with *.', 'error');
                return;
            }

            if (email === 'vc@baou.edu.in') {
                showToast('This email address is reserved for the Vice-Chancellor.', 'error');
                return;
            }

            if (scholarType === 'Passed / Alumni Scholar' && !passingYear) {
                showToast('Please enter your PhD Passing / Convocation Year.', 'error');
                return;
            }

            state.isSubmitting = true;
            renderApp();

            try {
                const existing = await fetchScholarByEmail(email);
                if (existing) {
                    state.isSubmitting = false;
                    renderApp();
                    showToast('A scholar registration with this Email ID already exists. Try logging in or check approval status.', 'warning');
                    return;
                }

                const payload = {
                    category: scholarType === 'Passed / Alumni Scholar' ? 'passed' : 'active',
                    enrollment_no: enrollmentNo || 'BAOU/PHD/PENDING',
                    passing_year: scholarType === 'Passed / Alumni Scholar' ? passingYear : '',
                    name: fullName,
                    department: department || 'School of Humanities & Social Sciences',
                    email: email,
                    phone: phone,
                    topic: thesisTitle,
                    scopus_status: scopusStatus,
                    scopus_title: scopusPaperTitle || 'Not yet specified',
                    scopus_journal: scopusJournal || 'Not yet specified',
                    progress_till_date: initialProgress,
                    approval_status: 'pending',
                    vc_remark: '',
                    logs: []
                };

                const { data, error } = await supabaseClient
                    .from('phd_scholars')
                    .insert([payload])
                    .select()
                    .single();

                if (error) throw error;

                if (data) {
                    state.scholars.unshift(mapRowToScholar(data));
                }

                state.isSubmitting = false;
                state.activeLandingTab = 'login';
                renderApp();
                showToast(`Registration request sent to Prof. (Dr.) Ami Upadhyay! Once approved, login with Email (${email}) and Password (${phone}).`, 'success');
            } catch (err) {
                state.isSubmitting = false;
                renderApp();
                showToast('Submission failed: ' + (err.message || 'Could not save registration.'), 'error');
            }
        }

        // =========================================================================
        // 5. VICE-CHANCELLOR (ADMIN) ACTIONS
        // =========================================================================
        async function handleScholarApproval(scholarId, decision) {
            const scholar = state.scholars.find(s => s.id === scholarId);
            if (!scholar) return;

            try {
                const { error } = await supabaseClient
                    .from('phd_scholars')
                    .update({ approval_status: decision.toLowerCase() })
                    .eq('id', scholarId);

                if (error) throw error;

                scholar.approvalStatus = decision;
                renderApp();

                if (decision === 'Approved') {
                    showToast(`Approved ${scholar.fullName}! They can now log in using ID: ${scholar.email} & Password: ${scholar.phone}.`, 'success');
                } else {
                    showToast(`Registration request for ${scholar.fullName} marked as Rejected.`, 'warning');
                }
            } catch (err) {
                showToast('Failed to update status: ' + (err.message || 'Database error.'), 'error');
            }
        }

        function setVcTab(tab) {
            state.vcActiveTab = tab;
            renderApp();
        }

        function handleVcSearch(val) {
            state.vcSearchQuery = val;
            renderApp();
            const input = document.getElementById('vc-search-input');
            if (input) {
                input.focus();
                input.setSelectionRange(val.length, val.length);
            }
        }

        function openScholarModal(scholarId) {
            state.selectedModalScholarId = scholarId;
            renderScholarModal();
            document.getElementById('scholar-modal').classList.remove('hidden');
        }

        function closeScholarModal() {
            state.selectedModalScholarId = null;
            document.getElementById('scholar-modal').classList.add('hidden');
        }

        async function handleSaveVcRemark(scholarId, logId) {
            const scholar = state.scholars.find(s => s.id === scholarId);
            if (!scholar) return;
            const log = scholar.weeklyLogs.find(l => l.id === logId);
            if (!log) return;

            const remarkInput = document.getElementById(`vc-remark-input-${logId}`);
            if (!remarkInput) return;

            const updatedRemark = remarkInput.value.trim();
            const updatedLogs = scholar.weeklyLogs.map(item =>
                item.id === logId ? { ...item, vcRemark: updatedRemark, vcReviewed: true } : item
            );

            try {
                const { error } = await supabaseClient
                    .from('phd_scholars')
                    .update({
                        logs: updatedLogs,
                        vc_remark: updatedRemark
                    })
                    .eq('id', scholarId);

                if (error) throw error;

                scholar.weeklyLogs = updatedLogs;
                renderScholarModal();
                renderApp();
                showToast(`VC Sunday Review & Guidance saved for ${scholar.fullName}.`, 'success');
            } catch (err) {
                showToast('Failed to save VC remark: ' + (err.message || 'Database error.'), 'error');
            }
        }

        // =========================================================================
        // 6. APPROVED SCHOLAR ACTIONS (WEEKLY / DAILY LOG SUBMISSION)
        // =========================================================================
        function getNextOrCurrentSunday() {
            const d = new Date();
            const day = d.getDay();
            const diff = day === 0 ? 0 : 7 - day;
            const sunday = new Date(d);
            sunday.setDate(d.getDate() + diff);
            return sunday.toISOString().split('T')[0];
        }

        async function handleSubmitScholarLog(event) {
            event.preventDefault();
            if (state.isSubmitting) return;
            if (!state.currentUser || state.currentUser.role !== 'scholar') return;

            const scholar = state.scholars.find(s => s.id === state.currentUser.id);
            if (!scholar) return;

            const date = document.getElementById('log-date').value;
            const dayType = document.getElementById('log-day-type').value;
            const workSummary = document.getElementById('log-work-summary').value.trim();
            const scopusUpdateStatus = document.getElementById('log-scopus-status').value;
            const scopusPaperTitle = document.getElementById('log-scopus-title').value.trim();
            const scopusJournal = document.getElementById('log-scopus-journal').value.trim();
            const scopusDoi = document.getElementById('log-scopus-doi').value.trim();
            const issuesFaced = document.getElementById('log-issues').value.trim();
            const needsVcAttention = document.getElementById('log-needs-attention').checked;

            if (!date || !workSummary) {
                showToast('Please enter the Date and your Work Completed Summary.', 'error');
                return;
            }

            const newLog = {
                id: 'log-' + Date.now(),
                date,
                dayType,
                workSummary,
                scopusUpdateStatus,
                scopusPaperTitle: scopusPaperTitle || scholar.scopusPaperTitle,
                scopusJournal: scopusJournal || scholar.scopusJournal,
                scopusDoi: scopusDoi || scholar.scopusDoi,
                issuesFaced: issuesFaced || 'No issues reported this week.',
                needsVcAttention,
                vcReviewed: false,
                vcRemark: ''
            };

            const nextPaperTitle = scopusPaperTitle || scholar.scopusPaperTitle;
            const nextJournal = scopusJournal || scholar.scopusJournal;
            const updatedLogs = [newLog, ...(scholar.weeklyLogs || [])];
            const reportedIssueText = needsVcAttention || (issuesFaced && !issuesFaced.toLowerCase().startsWith('none') && !issuesFaced.toLowerCase().startsWith('no issues'))
                ? (issuesFaced || 'Needs VC attention')
                : '';

            state.isSubmitting = true;
            renderApp();

            try {
                const { data, error } = await supabaseClient
                    .from('phd_scholars')
                    .update({
                        scopus_status: scopusUpdateStatus,
                        scopus_title: nextPaperTitle,
                        scopus_journal: nextJournal,
                        current_issues: reportedIssueText,
                        logs: updatedLogs
                    })
                    .eq('id', scholar.id)
                    .select()
                    .single();

                if (error) throw error;

                const mapped = mapRowToScholar(data);
                mapped.scopusDoi = scopusDoi || scholar.scopusDoi;
                const idx = state.scholars.findIndex(s => s.id === scholar.id);
                if (idx >= 0) state.scholars[idx] = mapped;

                state.isSubmitting = false;
                renderApp();
                showToast('Your progress & Scopus update has been submitted for Prof. (Dr.) Ami Upadhyay’s Sunday review!', 'success');
            } catch (err) {
                state.isSubmitting = false;
                renderApp();
                showToast('Could not submit report: ' + (err.message || 'Database error.'), 'error');
            }
        }

        // =========================================================================
        // 7. UI BADGE & HELPER FORMATTERS
        // =========================================================================
        function getScopusBadge(status) {
            const map = {
                'Published': 'bg-emerald-100 text-emerald-800 border-emerald-200',
                'Accepted': 'bg-teal-100 text-teal-800 border-teal-200',
                'Under Review': 'bg-amber-100 text-amber-800 border-amber-200',
                'Drafting': 'bg-sky-100 text-sky-800 border-sky-200',
                'Not Started': 'bg-slate-100 text-slate-700 border-slate-200'
            };
            const icons = {
                'Published': 'fa-award',
                'Accepted': 'fa-check-double',
                'Under Review': 'fa-hourglass-half',
                'Drafting': 'fa-pen-nib',
                'Not Started': 'fa-circle-dot'
            };
            const cls = map[status] || map['Not Started'];
            const icon = icons[status] || 'fa-file-lines';
            return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${cls}">
                <i class="fa-solid ${icon}"></i> Scopus: ${status}
            </span>`;
        }

        function getScholarTypeBadge(scholar) {
            if (scholar.scholarType === 'Passed / Alumni Scholar') {
                return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-purple-100 text-purple-800 border border-purple-200">
                    <i class="fa-solid fa-user-graduate"></i> Passed / Alumni ${scholar.passingYear ? `(${scholar.passingYear})` : ''}
                </span>`;

                                                    </div>
                                                ` : `
                                                    <div class="text-xs text-amber-700 bg-amber-50/50 px-3 py-2 rounded-lg border border-amber-200/60 flex items-center gap-2">
                                                        <i class="fa-solid fa-clock"></i>
                                                        <span>Submitted — Awaiting Prof. (Dr.) Ami Upadhyay's Sunday review.</span>
                                                    </div>
                                                `}
                                            </div>
                                        `).join('')}
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            loadSession();
            renderApp();
            if (state.currentUser) {
                if (state.currentUser.role === 'vc') {
                    await fetchAllScholarsFromCloud();
                    renderApp();
                } else if (state.currentUser.role === 'scholar' && state.currentUser.id) {
                    const fresh = await fetchScholarById(state.currentUser.id);
                    if (fresh) {
                        state.scholars = [fresh];
                    } else {
                        state.currentUser = null;
                        saveSession();
                    }
                    renderApp();
                }
            }
        });
    </script>
</body>
</html>
